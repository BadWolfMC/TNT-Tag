info-command:
  - "<aqua>=========TNT-Tag========="
  - ""
  - "<dark_aqua>ARENA:<aqua> {arena_name}"
  - ""
  - "<aqua>Is running?: <white>{is_running}"
  - "<aqua>Countdown: <white>{countdown}"
  - "<aqua>Players (min/max): <white>{min_players}/{max_players}"

help-menu:
  - "<aqua>=========TNT-Tag========="
  - "<green>/tnttag help - Shows you this menu!"
  - "<green>/tnttag join (arena) - Join the specified arena!"
  - "<green>/tnttag autojoin (arena) - Randomly join an arena."
  - "<green>/tnttag joingui - Shows you a nice GUI to join arenas!"
  - "<green>/tnttag leave - Leave the arena that you're in."
  - "<green>/tnttag create - Create an arena, you can find more information on the spigot page."
  - "<green>/tnttag delete [arena] - Delete the specified arena."
  - "<green>/tnttag list - List all the available TNT-Tag arena's!"
  - "<green>/tnttag reload - Reload the plugin."
  - "<green>/tnttag stats - Show your stats!"
  - "<green>/tnttag top - Shows the top players!"
  - "<green>/tnttag editor [arena] - Opens the arena editor."
  - "<green>/tnttag dump log - Dump your latest server log to share it with the developer."
  - "<green>/tnttag dump all - Create a dump from your server so we can quickly solve your issues, this is handled safely and securely. Nobody except our staff team can see them."
  - "<green>/tnttag start (arena) [forced] - Start the countdown or force the start of an arena."
  - "<aqua>=========TNT-Tag========="

