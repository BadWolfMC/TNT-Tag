#Signs customization
#Placeholders:
# {arena} -> the arena name
# {state} -> the game state that you can set above (IDLE, STARTING...)
# {current_players} -> the amount of players that are playing, will be an empty string if the arena state isn't "INGAME"
# {max_players} -> same as above but returns the max amount of players that the arena is configured to handle
join-sign:
  lines:
    - "<gold>[<red>TNT-Tag<gold>]"
    - "<white>{arena}"
    - "{state}"
    - "<green><bold>{current_players}<white>/<dark_green><bold>{max_players}"

leave-sign:
  lines:
    - "<gold>[<red>TNT-Tag<gold>]"
    - ""
    - "<dark_red><bold>LEAVE"
    - "<red>Click to leave"

#Placeholders:
# {top_type} -> The top type you specified when setting up the sign (WINS, TIMESTAGGED, TAGS)
# {top_position} -> Returns the top position as number
# {player} -> the Player name that corresponds
top-sign:
  lines:
    - "<gold>[<red>TNT-Tag<gold>]"
    - "<red>{top_type}"
    - "<gold>Position <dark_red>#{top_position}"
    - "<white>{player}"
  types:
    WINS: "<green>Wins"
    TIMESTAGGED: "<red>Times tagged"
    TAGS: "<aqua>Tags got"
  no-data: "NOBODY" #Value of {player} if there's no data for the stat type yet, don't use color codes here.

#You can find sounds at: https://helpch.at/docs/1.13/index.html?org/bukkit/Sound.html
#The sound names are case-insensitive.
sounds:
  lobby-join: "entity_experience_orb_pickup"
  lobby-leave: "entity_experience_orb_pickup"
  countdown: "entity_player_levelup"
  round-start: "entity_firework_rocket_launch"
  round-end: "entity_generic_explode"
  tagged: "entity_arrow_hit_player"
  untagged: "entity_player_levelup"

# Can't be longer as 25 characters TOTAL(so including the player name), keep it as short as possible.
# Both for the chat and TAB.
name-prefixes:
  survivor: "<dark_green>[S]"
  tagger: "<red><bold>[T]"
  spectator: "<dark_gray>[S]"

# The formatting of the top placeholders.
top-placeholder-formatting:
  wins: "<gold>★ <white>%player% <dark_gray>- <aqua>%amount% wins"
  timestagged: "<gold>★ <white>%player% <dark_gray>- <aqua>%amount% times tagged"
  tags: "<gold>★ <white>%player% <dark_gray>- <aqua>%amount% tags"
  winstreak: "<gold><gold>★ <white>%player% <dark_gray>- winstreak from <aqua>%amount% wins!"